<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
:root{--bg:#0a1c16;--card:#12302a;--card2:#1a3f37;--line:#2a5a50;--tx:#f0f7f4;--mut:#a9c4bb;--acc:#4fd1a1;--warn:#f2b84b;--bad:#ff7070;--tb:56px;--nav:64px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:calc(var(--tb) + env(safe-area-inset-top)) 0 calc(var(--nav) + env(safe-area-inset-bottom) + 8px)}
/* Topbar */
#topbar{position:fixed;top:0;left:0;right:0;z-index:1000;padding-top:env(safe-area-inset-top);background:#071510;border-bottom:1px solid var(--line)}
#topbar .in{height:var(--tb);display:flex;align-items:center;gap:10px;padding:0 12px}
#tbCanton{flex:0 0 auto;min-height:36px;padding:6px 10px;border-radius:10px;background:var(--card2);border:1px solid var(--line);color:var(--tx);font-weight:700;font-size:14px}
#tbStatus{flex:1;min-width:0;display:flex;align-items:center;gap:8px;cursor:pointer}
#tbStatus .dot{flex:0 0 12px;height:12px;border-radius:50%;background:var(--mut)}
#tbStatus .txt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;font-size:15px}
#tbStatus .sub{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tbStatus .dot.ok{background:var(--acc)}#tbStatus .dot.bad{background:var(--bad)}#tbStatus .dot.warn{background:var(--warn)}
#topbar.bad{background:#3a0f0f;border-color:#7a2a2a}
main{padding:0 12px;max-width:720px;margin:0 auto}
section.view{display:none}section.view.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
.card h2{font-size:17px;margin:0 0 10px}
.mut{color:var(--mut)}.small{font-size:13px}
button{appearance:none;border-radius:12px;padding:12px 16px;font:inherit;font-weight:650;background:var(--card2);color:var(--tx);border:1px solid var(--line);cursor:pointer;min-height:48px}
button.pri{background:var(--acc);color:#04261a;border-color:var(--acc)}
button.bad{background:var(--bad);color:#2a0606;border-color:var(--bad)}
button.full{width:100%}
button:active{transform:scale(.98)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
select,input,textarea{width:100%;font:inherit;padding:12px;border-radius:12px;border:1px solid var(--line);background:#0c241e;color:var(--tx);min-height:48px}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 5px}
.chk{display:flex;align-items:center;gap:10px;margin:10px 0 0;font-size:14px;color:var(--tx)}
.chk input{width:22px;height:22px;min-height:0;accent-color:var(--acc)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mut);font-weight:500}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;vertical-align:middle}
.p-ok{background:#1d5a45;color:#c4f7e1}.p-warn{background:#5a4718;color:#ffe3a6}.p-bad{background:#5f1d1d;color:#ffd0d0}.p-mut{background:#24403a;color:var(--mut)}
.hero{border-radius:16px;padding:16px;margin:12px 0;border:1px solid var(--line)}
.hero.ok{background:linear-gradient(160deg,#17503f,#12302a)}.hero.bad{background:linear-gradient(160deg,#5a1b1b,#2d1414);border-color:#7a2a2a}.hero.warn{background:linear-gradient(160deg,#4f3d13,#2b2412)}.hero.none{background:var(--card)}
.hero .t{font-size:22px;font-weight:750;line-height:1.2}
.hero .d{color:var(--mut);margin-top:4px;font-size:14px}
.hero ul{margin:10px 0 0;padding-left:20px}.hero li{margin:4px 0}
.verdict{border-radius:14px;padding:14px;margin-top:12px}
.verdict .big{font-size:20px;font-weight:750}
.v-ok{background:#164a39}.v-bad{background:#4a1616}.v-warn{background:#4a3a12}
.verdict .ln{font-size:14px;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{min-height:42px;padding:8px 12px;font-size:14px;border-radius:99px}
.chips button.on{background:var(--acc);color:#04261a;border-color:var(--acc)}
.lenrow{display:flex;gap:8px}.lenrow button{flex:0 0 56px;font-size:22px;padding:0}
.lenrow input{flex:1;font-size:24px;font-weight:700;text-align:center}
details summary{cursor:pointer;color:var(--mut);margin-top:12px;font-size:14px}
.list .it{padding:10px 0;border-bottom:1px solid var(--line)}.list .it:last-child{border:0}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat div{background:var(--card2);border-radius:12px;padding:10px;font-size:13px;color:var(--mut)}
.stat b{display:block;font-size:22px;color:var(--tx)}
.big{font-size:30px;font-weight:750}.timer{font-variant-numeric:tabular-nums}
.hide{display:none!important}
ul{padding-left:20px;margin:6px 0}li{margin:4px 0}
.copybox{white-space:pre-wrap;background:#0c241e;border:1px dashed var(--line);border-radius:12px;padding:12px;font-size:15px;margin-top:8px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:1000;display:flex;background:#071510;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;border-radius:0;background:none;min-height:var(--nav);font-size:11px;font-weight:650;color:var(--mut);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0}
nav button.on{color:var(--acc)}
nav svg{width:24px;height:24px}
/* Karte */
#v-karte.on{position:fixed;top:calc(var(--tb) + env(safe-area-inset-top));bottom:calc(var(--nav) + env(safe-area-inset-bottom));left:0;right:0;padding:0;margin:0;max-width:none}
#map{position:absolute;inset:0;background:#dfe7e4}
#mapMsg{position:absolute;left:12px;right:12px;top:12px;z-index:500}
.leaflet-container{font:14px/1.4 system-ui,sans-serif}
.leaflet-popup-content{margin:12px 14px;min-width:220px}
.leaflet-popup-content h3{margin:0 0 4px;font-size:16px}
.leaflet-popup-content button{min-height:40px;margin-top:8px;width:100%;background:#0f3d2e;color:#fff;border:0}
.lg{background:rgba(255,255,255,.95);color:#123;padding:8px 10px;border-radius:10px;font-size:12px;line-height:1.7;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.lg i{display:inline-block;width:22px;height:4px;border-radius:2px;margin-right:6px;vertical-align:middle}
.mylbl{background:#0f3d2e;color:#fff;font-weight:800;font-size:11px;padding:1px 5px;border-radius:6px;border:1px solid #fff;white-space:nowrap}
.mylbl.s{background:#b3261e}
.mebtn{background:#fff;color:#0f3d2e;border:0;width:44px;height:44px;min-height:0;padding:0;border-radius:10px;font-size:20px;box-shadow:0 1px 5px rgba(0,0,0,.35)}
#toast{position:fixed;left:50%;bottom:calc(var(--nav) + 16px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#e8f2ee;color:#0b1f18;padding:10px 16px;border-radius:12px;font-weight:650;font-size:14px;z-index:2000;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%}
#toast.on{opacity:1}
dialog{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:16px;max-width:440px;width:92%}
dialog::backdrop{background:rgba(0,0,0,.6)}
</style>
</head>
<body>

<div id="topbar"><div class="in">
  <button id="tbCanton" aria-label="Kanton">SO</button>
  <div id="tbStatus" role="button" aria-label="Status am aktuellen Ort">
    <span class="dot" id="tbDot"></span>
    <div style="min-width:0"><div class="txt" id="tbTxt">Standort wird gesucht …</div><div class="sub" id="tbSub"></div></div>
  </div>
</div></div>

<main>
<!-- HIER -->
<section class="view on" id="v-hier">
  <div id="hereHero"></div>
  <div id="hereRules"></div>
  <div class="card">
    <h2>Ort & Kanton</h2>
    <button class="pri full hide" id="btnGeo">📍 Standort aktivieren</button>
    <div id="geoMsg" class="mut small"></div>
    <label for="selCanton">Kanton</label>
    <select id="selCanton"></select>
    <label class="chk"><input type="checkbox" id="cbCantonAuto"> Kanton automatisch per Standort</label>
    <div id="secPick">
      <label for="selSec">Patentabschnitt</label>
      <select id="selSec"></select>
      <label class="chk"><input type="checkbox" id="cbSecAuto"> Abschnitt automatisch per Standort</label>
    </div>
  </div>
</section>

<!-- KARTE -->
<section class="view" id="v-karte">
  <div id="map"></div>
  <div id="mapMsg" class="hide"></div>
</section>

<!-- FANG -->
<section class="view" id="v-fang">
  <div id="fangCtx"></div>
  <div class="card"><h2>Angelzeit</h2><div id="sessBox"></div></div>
  <div class="card">
    <h2>Fang erfassen</h2>
    <div class="chips" id="spChips"></div>
    <label for="fArt">Fischart</label>
    <select id="fArt"></select>
    <label for="fLen">Länge in cm (Kopfspitze bis Schwanzende)</label>
    <div class="lenrow"><button type="button" data-d="-1" aria-label="minus">−</button><input id="fLen" type="number" inputmode="decimal" step="0.5" min="0" placeholder="cm"><button type="button" data-d="1" aria-label="plus">+</button></div>
    <div id="liveCheck"></div>
    <details><summary>Anzahl & Notiz</summary>
      <label for="fAnz">Anzahl (für Massenfänge wie Rotauge, Egli)</label>
      <input id="fAnz" type="number" inputmode="numeric" min="1" value="1">
      <label for="fNote">Notiz (Köder, Wetter …)</label>
      <input id="fNote" type="text" placeholder="z.B. Spinner, trüb">
    </details>
    <button class="pri full" id="btnSave" style="margin-top:14px">Fang speichern</button>
    <div id="afterSave"></div>
  </div>
</section>

<!-- STATISTIK -->
<section class="view" id="v-stat">
  <div class="card"><h2>Heute</h2><div class="stat" id="statToday"></div></div>
  <div class="card"><h2>Saison <span id="statYear"></span></h2><div class="stat" id="statSeason"></div></div>
  <div class="card"><h2>Alle Fänge</h2><div id="logList" class="list"></div></div>
  <div class="card">
    <h2>Daten sichern</h2>
    <p class="mut small">Deine Fänge liegen nur auf diesem Handy. Sichere sie ab und zu.</p>
    <div class="row"><button id="btnExport">Exportieren (CSV)</button><button id="btnImport">Importieren</button></div>
    <input type="file" id="fileImport" accept=".csv,text/csv" class="hide">
  </div>
</section>

<!-- REGELN -->
<section class="view" id="v-regeln">
  <div id="rulesBody"></div>
  <div class="card" id="dataCard"></div>
</section>
</main>

<nav>
  <button data-v="hier" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6.3-7-12a7 7 0 0 1 14 0c0 5.7-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>Hier</button>
  <button data-v="karte"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></svg>Karte</button>
  <button data-v="fang"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12c3-4 7-6 12-5 3 .6 5 2.3 6 3.5L23 8v8l-3-2.5c-1 1.2-3 2.9-6 3.5-5 1-9-1-12-5z"/></svg>Fang</button>
  <button data-v="stat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Statistik</button>
  <button data-v="regeln"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>Regeln</button>
</nav>

<div id="toast"></div>
<dialog id="dlg"><div id="dlgBody"></div><div class="row" style="margin-top:12px"><button id="dlgNo">Abbrechen</button><button class="pri" id="dlgYes">OK</button></div></dialog>

let RULES={

  protected:["Äsche","Aal","Nase","Lachs","Strömer","Bachneunauge","Bitterling"],

const SPECIES=["Bachforelle","Regenbogenforelle","Seeforelle","Saibling","Äsche","Hecht","Zander","Egli (Flussbarsch)","Felchen","Barbe","Alet","Rotauge","Brachsmen","Karpfen","Schleie","Wels","Aal","Nase","Lachs","Strömer","Bachneunauge","Bitterling","andere Art"];

/* ================= HILFSFUNKTIONEN ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const md=d=>(d.getMonth()+1)*100+d.getDate();
function inRange(d,from,to){const x=md(d),a=from[0]*100+from[1],b=to[0]*100+to[1];return a<=b?(x>=a&&x<=b):(x>=a||x<=b)}
const p2=n=>String(n).padStart(2,"0");
const fmtR=r=>`${p2(r[0][1])}.${p2(r[0][0])}.–${r[1][0]===2&&r[1][1]>=28?"Ende Feb.":p2(r[1][1])+"."+p2(r[1][0])+"."}`;
const fmtSlot=s=>s.map(([a,b])=>b?`${a}–${b} cm`:`ab ${a} cm`).join(" oder ");
const dayKey=d=>`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;

let toastT;function toast(t){const el=$("#toast");el.textContent=t;el.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove("on"),2600)}
function ask(html,yes,noBtn){const d=$("#dlg");$("#dlgBody").innerHTML=html;$("#dlgNo").classList.toggle("hide",noBtn===false);$("#dlgYes").onclick=()=>{d.close();yes&&yes()};$("#dlgNo").onclick=()=>d.close();try{d.showModal()}catch(e){}}

let state={canton:store.get("canton","SO"),cantonAuto:store.get("cantonAuto",true),sec:store.get("sec","A2"),secAuto:store.get("secAuto",true),log:store.get("log",[]),sess:store.get("sess",null),pos:null,here:null,geoErr:null};
function save(){["canton","cantonAuto","sec","secAuto","log","sess"].forEach(k=>store.set(k,state[k]))}

/* ================= GEODATEN (offizielle SO-Gewässer) ================= */
const WFS="https://geo.so.ch/api/wfs?SERVICE=WFS&VERSION=1.1.0&REQUEST=GetFeature&TYPENAME=ch.so.awjf.gewaesser.patentgewaesser&OUTPUTFORMAT=application/json&SRSNAME=EPSG:4326";
function fallbackGeo(){return{official:false,date:null,features:SECTIONS.map(s=>({id:s.id,art:"Patent",b:"",t:s.desc,l:[s.pts.map(([la,lo])=>[lo,la])]}))}}
let GEO=store.get("geo",null)||fallbackGeo();
function sqSeg(p,a,b){const k=Math.cos(p[1]*Math.PI/180);let x=a[0]*k,y=a[1],dx=b[0]*k-x,dy=b[1]-y;if(dx||dy){const t=((p[0]*k-x)*dx+(p[1]-y)*dy)/(dx*dx+dy*dy);if(t>1){x=b[0]*k;y=b[1]}else if(t>0){x+=dx*t;y+=dy*t}}dx=p[0]*k-x;dy=p[1]-y;return dx*dx+dy*dy}
function dp(pts,tol){if(pts.length<3)return pts;const sq=tol*tol,keep=new Uint8Array(pts.length);keep[0]=keep[pts.length-1]=1;const st=[[0,pts.length-1]];while(st.length){const[f,l]=st.pop();let m=0,i0=0;for(let i=f+1;i<l;i++){const d=sqSeg(pts[i],pts[f],pts[l]);if(d>m){m=d;i0=i}}if(m>sq){keep[i0]=1;st.push([f,i0],[i0,l])}}return pts.filter((_,i)=>keep[i])}
async function refreshGeo(force){
  if(!location.protocol.startsWith("http")||!navigator.onLine)return"offline";
  const age=GEO.date?(Date.now()-new Date(GEO.date).getTime())/864e5:1e9;
  if(!force&&GEO.official&&age<7)return"fresh";
  try{
    const j=await fetch(WFS,{cache:"no-store"}).then(r=>{if(!r.ok)throw 0;return r.json()});
    const tol=8/111320,r5=c=>[+c[0].toFixed(5),+c[1].toFixed(5)];
    const feats=(j.features||[]).map(x=>{const g=x.geometry||{};let L=[];
      if(g.type==="MultiLineString")L=g.coordinates;else if(g.type==="LineString")L=[g.coordinates];else if(g.type==="Polygon")L=[g.coordinates[0]];else if(g.type==="MultiPolygon")L=g.coordinates.map(p=>p[0]);
      const p=x.properties||{};return{id:String(p.revierid||"").trim(),art:p.fischerei||"",b:p.fischbestand||"",t:String(p.beschreibung||"").trim().replace(/\s+/g," "),l:L.map(l=>dp(l,tol).map(r5))}}).filter(f=>f.id&&f.l.length);
    if(feats.length<10)throw 0;
    GEO={official:true,date:new Date().toISOString(),features:feats};
    store.set("geo",GEO);
    onGeoChanged();
    return"new";
  }catch(e){return"error"}
}
function distToLines(lat,lon,lines){const R=6371000,k=Math.cos(lat*Math.PI/180);let best=Infinity;
  for(const l of lines){for(let i=0;i<l.length-1;i++){const ax=(l[i][0]-lon)*Math.PI/180*R*k,ay=(l[i][1]-lat)*Math.PI/180*R,bx=(l[i+1][0]-lon)*Math.PI/180*R*k,by=(l[i+1][1]-lat)*Math.PI/180*R;const dx=bx-ax,dy=by-ay,L=dx*dx+dy*dy;let t=L?-(ax*dx+ay*dy)/L:0;t=Math.max(0,Math.min(1,t));const d=Math.hypot(ax+t*dx,ay+t*dy);if(d<best)best=d}}return best}
function kindOf(art){return{Patent:"patent",Pacht:"pacht",Privat:"privat",Schon:"schon"}[art]||"other"}

/* ================= REGELN ================= */
function secById(id){
  const s=SECTIONS.find(x=>x.id===id);if(s)return Object.assign({kind:"patent"},s);
  const f=GEO.features.find(x=>x.id===id);
  if(f){const k=kindOf(f.art);
    if(k==="schon")return{id,kind:k,name:"Schonstrecke "+id,desc:f.t,group:"schon",regime:"SO",notes:["Strecke vor Ort mit Tafeln markiert"]};
    if(k==="pacht")return{id,kind:k,name:"Pachtrevier "+id,desc:f.t,group:"pacht",regime:"SO",closed:STREAM_CLOSED,notes:["Mit dem Patent nicht befischbar – nur mit Bewilligung des Pächters (meist Fischereiverein)."]};
    if(k==="privat")return{id,kind:k,name:"Privatgewässer "+id,desc:f.t,group:"pacht",regime:"SO",closed:STREAM_CLOSED,notes:["Nur mit Erlaubnis des Eigentümers."]};}
  return Object.assign({kind:"patent"},SECTIONS[1]);
}
const R_SO=()=>RULES.SO;
function isProt(sp){return(R_SO().protected||[]).includes(sp)}
function soRule(sec,sp){
  const R=R_SO();
  if(sec.regime==="BLSO"&&R.birs&&R.birs[sp])return Object.assign({},R.birs[sp]);
  if(isProt(sp))return{prot:true,note:sp==="Äsche"?"Äsche ganzjährig geschont":sp+" ist geschützt"};
  if(sp==="Bachforelle"){const tb=R.troutByGroup||{};return{slot:tb[sec.group]||tb.default||[[26,null]],schon:R.troutSchon,day:R.troutDay,dayGroup:"trout",year:R.troutYear}}
  const s=R.species&&R.species[sp];if(s)return Object.assign({},s);
  return{note:"Für diese Art gibt es in SO kein Mindestmass und keine Schonzeit"};
}
function natRule(sp){
  const C=RULES.CH;
  if(["Aal","Lachs","Strömer","Bachneunauge","Bitterling","Nase"].includes(sp))return{prot:true,note:sp+" ist in vielen Kantonen geschützt – kantonal prüfen"};
  const n=C.sizes[sp];
  if(n)return{slot:[[n,null]],national:true,weeks:C.weeks[sp],note:sp==="Bachforelle"||sp==="Seeforelle"?`In grösseren Seen unter 800 m: ab ${C.troutLake} cm`:null};
  return{national:true,note:"Kein nationales Mindestmass – kantonal prüfen"};
}
function ruleFor(sec,sp){return isDetailed(state.canton)?soRule(sec,sp):natRule(sp)}
function currentSec(){return secById(state.sec)}
function secStatus(sec,d=new Date()){
  const out=[];
  if(!isDetailed(state.canton))return out;
  if(sec.kind==="schon")out.push({lvl:"bad",txt:"Schonstrecke – Fischen verboten"});
  if(sec.closed&&inRange(d,sec.closed.from,sec.closed.to))out.push({lvl:"bad",txt:sec.closed.why});
  NEWS.forEach(n=>{if((n.secs||[]).includes(sec.id))out.push({lvl:"bad",txt:`Verfügung vom ${n.date}: Fischereiverbot bis auf Widerruf`})});
  if(sec.kind==="pacht")out.push({lvl:"warn",txt:"Pachtgewässer – das Patent gilt hier nicht"});
  if(sec.kind==="privat")out.push({lvl:"warn",txt:"Privatgewässer – das Patent gilt hier nicht"});
  return out;
}
function countToday(sp,grp){const t=dayKey(new Date());return state.log.filter(f=>f.day===t&&f.kept&&(grp?TROUT_GROUP.includes(f.art):f.art===sp)).reduce((a,f)=>a+(f.n||1),0)}
function countYear(sp){const y=String(new Date().getFullYear());return state.log.filter(f=>f.day.startsWith(y)&&f.kept&&f.art===sp&&(f.canton||"SO")==="SO"&&SECTIONS.some(s=>s.id===f.sec)).reduce((a,f)=>a+(f.n||1),0)}
function check(sec,sp,len,d=new Date()){
  const r=ruleFor(sec,sp),issues=[],infos=[];
  secStatus(sec,d).forEach(x=>x.lvl==="bad"?issues.push(x.txt):infos.push(x.txt));
  if(r.prot)issues.push(r.note+" – schonend mit nasser Hand zurücksetzen");
  if(r.schon&&inRange(d,r.schon[0],r.schon[1]))issues.push(`${sp}: Schonzeit ${fmtR(r.schon)}`);
  let needLen=false;
  if(r.slot){if(len==null||isNaN(len)){needLen=true;infos.push(`Erlaubt: ${fmtSlot(r.slot)}`)}
    else if(!r.slot.some(([a,b])=>len>=a&&(b==null||len<=b)))issues.push(`${len} cm ist nicht erlaubt – erlaubt: ${fmtSlot(r.slot)}`);
    else infos.push(`Mass ok (${fmtSlot(r.slot)})`)}
  if(r.day){const c=countToday(sp,r.dayGroup==="trout");if(c>=r.day)issues.push(`Tageslimite erreicht (${c}/${r.day})`);else infos.push(`Heute behalten: ${c}/${r.day}${r.dayGroup==="trout"?" Forellen+Saiblinge":""}`)}
  if(r.year&&sec.kind==="patent"){const c=countYear(sp);if(c>=r.year)issues.push(`Jahreslimite erreicht (${c}/${r.year})`);else infos.push(`Saison: ${c}/${r.year} Bachforellen`)}
  if(r.national){infos.push(r.weeks?`Schonzeit: mind. ${r.weeks} Wochen – Daten legt der Kanton fest`:"Schonzeit: kantonal prüfen");infos.push("Nur nationale Mindestvorgaben – der Kanton kann strenger sein")}
  if(r.note&&!r.prot)infos.push(r.note);
  needLen=needLen&&issues.length===0;
  return{ok:issues.length===0&&!needLen,needLen,issues,infos};
}

/* ================= STANDORT ================= */
let watchId=null,lastIdent=null;
function startGeo(){
  if(!("geolocation" in navigator)){state.geoErr="Dieses Gerät unterstützt keine Standortbestimmung.";renderAll();return}
  if(watchId!=null)return;
  watchId=navigator.geolocation.watchPosition(onPos,e=>{state.geoErr=e.code===1?"Standortzugriff verweigert – in den Browser-Einstellungen erlauben.":"Standort gerade nicht verfügbar.";if(e.code===1)stopGeo();renderTop();renderHier()},{enableHighAccuracy:true,maximumAge:15000,timeout:30000});
}
function stopGeo(){if(watchId!=null){navigator.geolocation.clearWatch(watchId);watchId=null}}
function onPos(p){
  const{latitude:lat,longitude:lon,accuracy:acc}=p.coords;
  state.pos={lat,lon,acc,ts:Date.now()};state.geoErr=null;
  identifyCanton(lat,lon);
  updateHere();
  if(map)updateMe();
}
function updateHere(){
  const p=state.pos;state.here=null;
  if(!p||state.canton!=="SO"||!GEO.features.length){renderAll();return}
  let best=null,bs=null;
  for(const f of GEO.features){const d=distToLines(p.lat,p.lon,f.l);if(f.art==="Schon"){if(!bs||d<bs.d)bs={f,d}}else if(!best||d<best.d)best={f,d}}
  let h;
  if(bs&&bs.d<=40)h={kind:"schon",id:bs.f.id,d:bs.d};
  else if(best&&best.d<=150)h={kind:kindOf(best.f.art),id:best.f.id,d:best.d,schonNear:bs&&bs.d<=150?bs:null};
  else h={kind:"none",near:best};
  state.here=h;
  if(state.secAuto&&h.id&&h.id!==state.sec){state.sec=h.id;save()}
  renderAll();
}
async function identifyCanton(lat,lon){
  if(!state.cantonAuto||!navigator.onLine)return;
  if(lastIdent&&Math.hypot((lat-lastIdent[0])*111e3,(lon-lastIdent[1])*75e3)<1500)return;
  lastIdent=[lat,lon];
  try{const u=`https://api3.geo.admin.ch/rest/services/api/MapServer/identify?geometry=${lon},${lat}&geometryType=esriGeometryPoint&layers=all:ch.swisstopo.swissboundaries3d-kanton-flaeche.fill&sr=4326&tolerance=0&returnGeometry=false&lang=de`;
    const j=await fetch(u).then(r=>r.json());const a=j.results&&j.results[0]&&j.results[0].attributes;
    if(a&&a.ak&&a.ak!==state.canton&&CANTONS.some(c=>c[0]===a.ak)){state.canton=a.ak;save();toast("Kanton erkannt: "+cname(a.ak));onCantonChanged()}
  }catch(e){lastIdent=null}
}

/* ================= RENDER: TOPBAR & HIER ================= */
function hereSummary(){
  const det=isDetailed(state.canton),sec=currentSec(),h=state.here;
  if(!det)return{cls:"warn",t:cname(state.canton)+": nationale Mindestregeln",s:"Kantonale Details folgen – vor Ort prüfen"};
  if(state.secAuto&&state.pos&&h&&h.kind==="none")return{cls:"none",t:"Kein SO-Fischereigewässer hier",s:h.near?`Nächstes: ${secById(h.near.f.id).name}, ${fmtM(h.near.d)}`:""};
  const st=secStatus(sec);const bad=st.find(x=>x.lvl==="bad"),warn=st.find(x=>x.lvl==="warn");
  const s=(state.secAuto&&h&&h.id===sec.id?`ca. ${fmtM(h.d)} entfernt`:(state.secAuto?"":"manuell gewählt"));
  if(sec.kind==="schon")return{cls:"bad",t:sec.name+" – Fischen verboten",s:"Schonstrecke, vor Ort mit Tafeln markiert"};
  if(bad)return{cls:"bad",t:sec.name+" – heute gesperrt",s:bad.txt};
  if(warn)return{cls:"warn",t:sec.name,s:warn.txt};
  if(h&&h.schonNear)return{cls:"warn",t:sec.name+" – offen",s:`Achtung: Schonstrecke ${h.schonNear.f.id} in ${fmtM(h.schonNear.d)}`};

}

  $("#tbDot").className="dot "+(cls==="none"?"":cls);

}
function rulesTableFor(sec){

  const list=det?["Bachforelle","Saibling","Äsche","Hecht","Felchen","Barbe","Egli (Flussbarsch)"]:["Bachforelle","Seeforelle","Saibling","Äsche","Hecht","Felchen","Egli (Flussbarsch)"];
  const now=new Date();
  return`<table><tr><th>Art</th><th>Mass</th><th>Schonzeit</th><th>Limite</th></tr>${list.map(sp=>{

    return`<tr><td><b>${esc(sp)}</b>${pill}</td><td>${mass}</td><td>${sz}</td><td>${lim}</td></tr>`}).join("")}</table>`;
}
function renderHier(){

    ${state.pos?`<div class="d" style="margin-top:8px">📍 Standort ±${Math.round(state.pos.acc)} m${h&&h.d!=null&&h.id?` · ${fmtM(h.d)} zur Gewässerlinie`:""}</div>`:""}</div>`;

    ${notes.length?`<div class="card"><h2>Besonderheiten</h2><ul>${notes.map(n=>`<li>${esc(n)}</li>`).join("")}</ul></div>`:""}
    ${det?`<div class="card"><h2>Überall in SO</h2><ul><li>Widerhaken verboten</li><li>Drillinge verboten – ausser Aare A1–A6</li><li>Max. 2 Ruten, je max. 2 Köder; immer beaufsichtigen</li><li>Fischpässe und Umgehungsgerinne: Fangen verboten</li></ul></div>`:""}`;
  $("#btnGeo").classList.toggle("hide",!!state.pos||watchId!=null);
  $("#geoMsg").textContent=state.geoErr||"";

    $("#selSec").innerHTML=opts.join("");$("#selSec").value=state.sec;$("#cbSecAuto").checked=state.secAuto}
}

function saveFang(){

function toCSV(){const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;return[["datum","zeit","kanton","gewaesser","art","laenge_cm","anzahl","behalten","notiz","lat","lon"].join(";")].concat(state.log.map(f=>{const d=new Date(f.ts);return[d.toLocaleDateString("de-CH"),d.toLocaleTimeString("de-CH",{hour:"2-digit",minute:"2-digit"}),f.canton||"SO",f.sec,f.art,f.len??"",f.n||1,f.kept?"ja":"nein",f.note,f.lat??"",f.lon??""].map(q).join(";")})).join("\n")}
function exportCSV(){const csv="﻿"+toCSV();try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download=`faenge_${dayKey(new Date())}.csv`;document.body.appendChild(a);a.click();a.remove()}catch(e){}
  ask(`<h2>Export</h2><p class="small">Falls kein Download startet: Text kopieren und z.B. in eine Notiz einfügen.</p><textarea rows="6" readonly>${esc(toCSV())}</textarea>`,null,false)}
function importCSV(file){const r=new FileReader();r.onload=()=>{const lines=String(r.result).replace(/^﻿/,"").split(/\r?\n/);const head=(lines.shift()||"").split(";").map(x=>x.replace(/"/g,""));const ix=k=>head.indexOf(k);let n=0;
  lines.filter(Boolean).forEach(l=>{const c=l.split(";").map(x=>x.replace(/^"|"$/g,"").replace(/""/g,'"'));const g=k=>ix(k)>=0?c[ix(k)]:"";const[dd,mm,yy]=g("datum").split(".");if(!yy)return;const ts=new Date(`${yy}-${p2(mm)}-${p2(dd)}T${g("zeit")||"12:00"}`).getTime();if(isNaN(ts)||state.log.some(f=>f.ts===ts&&f.art===g("art")))return;
    state.log.push({id:ts+Math.random(),ts,day:dayKey(new Date(ts)),canton:g("kanton")||"SO",sec:g("gewaesser")||g("abschnitt"),art:g("art"),len:g("laenge_cm")?parseFloat(g("laenge_cm")):null,n:parseInt(g("anzahl"))||1,kept:g("behalten")==="ja",note:g("notiz"),lat:g("lat")?+g("lat"):null,lon:g("lon")?+g("lon"):null});n++});
  state.log.sort((a,b)=>b.ts-a.ts);save();renderStats();ask(`<h2>Import</h2><p>${n} Fänge importiert.</p>`,null,false)};r.readAsText(file)}

let map=null,gLayer=null,meMarker=null,meCircle=null,catchLayer=null,follow=false;
function styleFor(f){
  const k=kindOf(f.art);
  if(k==="schon")return{color:"#d62828",weight:7,opacity:.95};
  if(k==="pacht")return{color:"#f08c00",weight:3,opacity:.85};
  if(k==="privat")return{color:"#7d8b88",weight:3,opacity:.8,dashArray:"6 6"};
  const sec=secById(f.id),bad=secStatus(sec).some(x=>x.lvl==="bad");
  return{color:bad?"#e03131":"#12b886",weight:6,opacity:.95,dashArray:bad?"10 8":null};
}
function popupFor(f){
  const sec=secById(f.id),st=secStatus(sec),k=sec.kind;
  const status=k==="schon"?`<span class="pill p-bad">Fischen verboten</span>`:st.some(x=>x.lvl==="bad")?`<span class="pill p-bad">heute gesperrt</span>`:k==="patent"?`<span class="pill p-ok">heute offen</span>`:`<span class="pill p-warn">nicht mit Patent</span>`;
  const r=k==="patent"||k==="pacht"||k==="privat"?soRule(sec,"Bachforelle"):null;
  return`<h3>${esc(sec.name)}</h3>${status}<div style="margin-top:6px">${esc(f.t)}</div>
    ${st.length?`<ul style="margin:6px 0 0;padding-left:18px">${st.map(s=>`<li>${esc(s.txt)}</li>`).join("")}</ul>`:""}
    ${r?`<div style="margin-top:6px"><b>Bachforelle:</b> ${fmtSlot(r.slot)}, Schonzeit ${fmtR(r.schon)}</div>`:""}
    ${k==="patent"||k==="pacht"||k==="privat"?`<button data-pick="${esc(f.id)}">Regeln für diesen Abschnitt</button>`:""}`;
}
function drawGeo(){
  if(!map)return;if(gLayer)gLayer.remove();gLayer=L.layerGroup().addTo(map);
  if(state.canton!=="SO"){return}
  const order={privat:0,pacht:1,patent:2,schon:3};
  [...GEO.features].sort((a,b)=>order[kindOf(a.art)]-order[kindOf(b.art)]).forEach(f=>{
    const latlngs=f.l.map(l=>l.map(([lo,la])=>[la,lo]));
    const pl=L.polyline(latlngs,styleFor(f)).bindPopup(()=>popupFor(f));pl.addTo(gLayer);
    const k=kindOf(f.art);
    if(k==="patent"||k==="schon"){const longest=f.l.reduce((a,l)=>l.length>a.length?l:a,f.l[0]);const m=longest[Math.floor(longest.length/2)];
      L.marker([m[1],m[0]],{interactive:false,icon:L.divIcon({className:"",html:`<span class="mylbl ${k==="schon"?"s":""}">${esc(f.id)}</span>`,iconSize:null})}).addTo(gLayer)}
  });
}
function drawCatches(){if(!map)return;catchLayer.clearLayers();state.log.filter(f=>f.lat!=null&&f.kept).forEach(f=>L.circleMarker([f.lat,f.lon],{radius:6,color:"#fff",weight:2,fillColor:"#1971c2",fillOpacity:1}).bindPopup(`<b>${esc(f.art)}</b>${f.len!=null?" · "+f.len+" cm":""}<br>${new Date(f.ts).toLocaleString("de-CH",{dateStyle:"short",timeStyle:"short"})}`).addTo(catchLayer))}

/* ================= UPDATES (Regeln/Hinweise) ================= */
function applyData(j){
  if(!j||typeof j.version!=="number")return false;
  const cached=store.get("data",null);
  if(cached&&cached.version>=j.version)return false;
  if(j.version<=DATA_META.version&&!cached)return false;
  if(Array.isArray(j.news))NEWS=j.news;
  if(j.rules)Object.keys(j.rules).forEach(c=>{RULES[c]=j.rules[c]});
  DATA_META={version:j.version,updated:j.updated||DATA_META.updated,checked:new Date().toISOString()};
  store.set("data",{version:j.version,updated:j.updated,news:NEWS,rules:j.rules||null});
  return true;
}
async function fetchUpdates(){
  if(!location.protocol.startsWith("http")||!navigator.onLine)return"offline";
  try{const j=await fetch("./data/updates.json?ts="+Date.now(),{cache:"no-store"}).then(r=>{if(!r.ok)throw 0;return r.json()});
    DATA_META.checked=new Date().toISOString();store.set("data_checked",DATA_META.checked);
    const ch=applyData(j);if(ch){renderAll();if(map)drawGeo()}return ch?"new":"same"}catch(e){return"offline"}
}
function loadCached(){const c=store.get("data",null);if(c&&c.version>=DATA_META.version){DATA_META={version:c.version,updated:c.updated,checked:store.get("data_checked",null)};if(c.news)NEWS=c.news;if(c.rules)Object.keys(c.rules).forEach(k=>{RULES[k]=c.rules[k]})}else DATA_META.checked=store.get("data_checked",null)}

$("#cbCantonAuto").onchange=e=>{state.cantonAuto=e.target.checked;save();if(state.cantonAuto&&state.pos){lastIdent=null;identifyCanton(state.pos.lat,state.pos.lon)}};
$("#selSec").onchange=e=>{state.sec=e.target.value;state.secAuto=false;save();renderAll()};
$("#cbSecAuto").onchange=e=>{state.secAuto=e.target.checked;save();updateHere()};
$("#btnGeo").onclick=()=>{state.geoErr=null;startGeo();renderHier()};
$("#spChips").innerHTML=QUICK.map(s=>`<button type="button" data-sp="${esc(s)}">${esc(s.replace(" (Flussbarsch)",""))}</button>`).join("");
$("#spChips").onclick=e=>{const b=e.target.closest("[data-sp]");if(b)setSpecies(b.dataset.sp)};
$("#fArt").innerHTML=SPECIES.map(s=>`<option>${esc(s)}</option>`).join("");
$("#fArt").onchange=e=>setSpecies(e.target.value);
$("#fLen").oninput=liveCheck;
document.querySelectorAll(".lenrow [data-d]").forEach(b=>b.onclick=()=>{const v=parseFloat($("#fLen").value)||0;$("#fLen").value=Math.max(0,v+parseFloat(b.dataset.d));liveCheck()});
$("#btnSave").onclick=saveFang;
$("#logList").onclick=e=>{const id=e.target.closest("[data-del]")?.dataset.del;if(id)ask("<h2>Fang löschen?</h2>",()=>{state.log=state.log.filter(f=>String(f.id)!==id);save();renderStats();if(map)drawCatches()})};
$("#btnExport").onclick=exportCSV;$("#btnImport").onclick=()=>$("#fileImport").click();
$("#fileImport").onchange=e=>{if(e.target.files[0])importCSV(e.target.files[0])};
document.addEventListener("visibilitychange",()=>{if(document.hidden)stopGeo();else if(state.pos||state.secAuto||state.cantonAuto)startGeo()});
window.addEventListener("online",()=>{fetchUpdates();refreshGeo()});

loadCached();
setSpecies("Bachforelle");
renderAll();renderStats();
startGeo();
fetchUpdates();refreshGeo();
if(location.protocol.startsWith("http")&&"serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
